version: '3'

includes:
  # build/windows/Taskfile.yml is untracked (see .gitignore), so a fresh
  # checkout or worktree has no Windows packaging tasks and must still load.
  windows:
    taskfile: ./build/windows/Taskfile.yml
    optional: true

tasks:
  build:
    cmds:
      - bun run build:wails
      - mkdir -p build/bin
      - go build -o build/bin/modkeeper .
  build:server:
    summary: Builds the application in Wails server mode
    cmds:
      - bun run build:wails
      - mkdir -p build/bin
      - go build -tags server -o build/bin/modkeeper-server .
  dev:server:
    summary: Runs a server-tagged backend with Vite HMR and real Wails IPC
    desc: |
      Runs the Go server on MODKEEPER_SERVER_PORT (default 8080) and Vite on
      WAILS_VITE_PORT (default 34116). Open the Vite URL to use the app.
    cmds:
      - |
        set -euo pipefail
        server_port="{{.MODKEEPER_SERVER_PORT | default "8080"}}"
        vite_port="{{.WAILS_VITE_PORT | default "34116"}}"
        backend_url="http://127.0.0.1:${server_port}"
        build_dir="$(mktemp -d "${TMPDIR:-/tmp}/modkeeper-server-dev.XXXXXX")"
        backend_pid=""
        vite_pid=""
        cleanup() {
          trap - EXIT
          if [ -n "$vite_pid" ]; then kill "$vite_pid" 2>/dev/null || true; wait "$vite_pid" 2>/dev/null || true; fi
          if [ -n "$backend_pid" ]; then kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true; fi
          rm -rf "$build_dir"
        }
        trap cleanup EXIT
        bun run build:wails
        echo "Building server-tagged backend..."
        go build -tags server -buildvcs=false -o "$build_dir/modkeeper-server" .
        echo "Starting backend at ${backend_url}..."
        MODKEEPER_SERVER_HOST=127.0.0.1 MODKEEPER_SERVER_PORT="$server_port" "$build_dir/modkeeper-server" &
        backend_pid=$!
        backend_ready=false
        for _ in $(seq 1 100); do
          if curl --silent --fail "${backend_url}/" >/dev/null 2>&1; then backend_ready=true; break; fi
          sleep 0.1
        done
        if [ "$backend_ready" != true ]; then echo "Backend did not become ready at ${backend_url}" >&2; exit 1; fi
        echo "Starting Vite at http://127.0.0.1:${vite_port}/..."
        MODKEEPER_SERVER_DEV=1 MODKEEPER_SERVER_URL="$backend_url" WAILS_APP=true WAILS_VITE_PORT="$vite_port" \
          bun run dev -- --host 127.0.0.1 --port "$vite_port" --strictPort &
        vite_pid=$!
        vite_ready=false
        for _ in $(seq 1 100); do
          if curl --silent --fail "http://127.0.0.1:${vite_port}/" >/dev/null 2>&1; then vite_ready=true; break; fi
          sleep 0.1
        done
        if [ "$vite_ready" != true ]; then echo "Vite did not become ready at http://127.0.0.1:${vite_port}/" >&2; exit 1; fi
        echo "Server development app ready at http://127.0.0.1:${vite_port}/"
        wait "$vite_pid"
  run:server:
    summary: Builds and runs the application in Wails server mode
    deps:
      - build:server
    cmds:
      - ./build/bin/modkeeper-server

  build:windows:
    summary: Builds both production Windows Wails executables
    cmds:
      - bun run build:wails
      - task: windows:build

  package:windows:
    summary: Builds both Windows executables and machine/user NSIS installers
    cmds:
      - bun run build:wails
      - task: windows:package

  run:
    cmds:
      - go run .
  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port 34115
