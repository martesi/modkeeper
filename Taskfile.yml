version: '3'

includes:
  windows: ./build/windows/Taskfile.yml

vars:
  SERVER_PORT: '{{.MODKEEPER_SERVER_PORT | default "8080"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default "34116"}}'

tasks:
  build:
    cmds:
      - bun run build:wails
      - mkdir -p build/bin
      - go build -o build/bin/modkeeper .
  frontend:build:
    internal: true
    sources:
      - src/**/*
      - public/**/*
      - locales/**/*
      - frontend/bindings/**/*
      - e2e/**/*
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - package.json
      - bun.lock
    generates:
      - dist/.wails-build
      - dist/index.html
    cmds:
      - bun run build:wails
      - printf '%s\n' 'Wails frontend bundle' > dist/.wails-build

  dist:placeholder:
    internal: true
    summary: Creates a placeholder dist/ so go:embed compiles when no frontend is built
    status:
      - test -f dist/index.html
    cmds:
      - mkdir -p dist
      - |
        cat > dist/index.html <<'HTML'
        <!doctype html>
        <title>Modkeeper</title>
        <p>Development backend. Open the Vite URL.</p>
        HTML

  server:build:
    internal: true
    cmds:
      - mkdir -p build/bin
      - go build -tags server -buildvcs=false -o build/bin/modkeeper-server .

  build:server:
    summary: Builds the application in Wails server mode
    cmds:
      - task: frontend:build
      - task: server:build

  dev:server:
    summary: Runs a server-tagged backend with Vite HMR and real Wails IPC
    desc: |
      Runs the Go server on MODKEEPER_SERVER_PORT (default 8080) and Vite on
      WAILS_VITE_PORT (default 34116). Open the Vite URL to use the app.
    deps:
      - task: dev:backend
      - task: dev:vite

  dev:backend:
    internal: true
    env:
      MODKEEPER_SERVER_HOST: 127.0.0.1
      MODKEEPER_SERVER_PORT: '{{.SERVER_PORT}}'
    cmds:
      - task: dist:placeholder
      - task: server:build
      - ./build/bin/modkeeper-server

  dev:vite:
    internal: true
    env:
      MODKEEPER_SERVER_DEV: '1'
      MODKEEPER_SERVER_URL: 'http://127.0.0.1:{{.SERVER_PORT}}'
      WAILS_APP: 'true'
      WAILS_VITE_PORT: '{{.VITE_PORT}}'
    cmds:
      - bun run dev -- --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort

  run:server:
    summary: Builds and runs the application in Wails server mode
    deps:
      - build:server
    cmds:
      - ./build/bin/modkeeper-server

  build:windows:
    summary: Builds both production Windows Wails executables
    cmds:
      - bun run build:wails
      - task: windows:build

  package:windows:
    summary: Builds both Windows executables and machine/user NSIS installers
    cmds:
      - sh scripts/build-windows.sh

  run:
    cmds:
      - go run .
  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port 34115
