name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

  publish-windows:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install frontend dependencies
        run: nix develop .#default -c bun ci --ignore-scripts

      - name: Generate Wails bindings
        run: nix develop .#default -c bun run bindings:wails

      - name: Build Windows NSIS installers
        run: sh scripts/build-windows.sh

      - name: Upload Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            build/bin/modkeeper-amd64-machine-installer.exe \
            build/bin/modkeeper-amd64-user-installer.exe \
            build/bin/modkeeper-arm64-machine-installer.exe \
            build/bin/modkeeper-arm64-user-installer.exe

  publish-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install frontend dependencies
        run: nix develop .#default -c bun ci --ignore-scripts

      - name: Generate Wails bindings
        run: nix develop .#default -c bun run bindings:wails

      - name: Build embedded frontend
        run: nix develop .#default -c bun run build:wails

      - name: Build Linux binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          nix develop .#default -c bash -c '
            set -euo pipefail
            version="${TAG#v}"
            mkdir -p build/release
            go build -trimpath -o "build/release/Modkeeper_${version}_linux_x86_64" .
          '

      - name: Upload Linux binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "build/release/Modkeeper_${TAG#v}_linux_x86_64"
