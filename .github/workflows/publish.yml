name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: 'x86_64-pc-windows-msvc'
            os: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            binary: false
          - target: 'aarch64-pc-windows-msvc'
            os: windows-latest
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            binary: false
          - target: 'x86_64-unknown-linux-gnu'
            os: ubuntu-22.04
            args: '--target x86_64-unknown-linux-gnu --no-bundle'
            binary: true
            assetName: 'Modkeeper_[version]_linux_x86_64'

    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun ci --ignore-scripts

      - name: build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }} --locked
          uploadPlainBinary: ${{ matrix.settings.binary }}
          releaseAssetNamePattern: ${{ matrix.settings.assetName }}
