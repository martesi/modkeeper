name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend dependencies
        run: bun ci --ignore-scripts

      - name: Typecheck active frontend
        run: bun run typecheck

      - name: Lint active frontend scope
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Check design tokens
        run: bun run scripts/check-tokens.ts

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        run: bun run test:rust --locked

      - name: Check Rust formatting
        run: bun run rust:fmt:check

      - name: Generated bindings drift check
        run: bun run bindings:check
