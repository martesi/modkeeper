name: test

# Runs on every branch push so work-in-progress branches get the full gate, and
# on pull requests into main.
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend dependencies
        run: bun ci --ignore-scripts

      - name: Typecheck active frontend
        run: bun run typecheck

      - name: Lint active frontend scope
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Check design tokens
        run: bun run scripts/check-tokens.ts

      - name: Check test path selection
        run: bun run paths:check

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        run: bun run test:rust --locked

      - name: Check Rust formatting
        run: bun run rust:fmt:check

      - name: Generated bindings drift check
        run: bun run bindings:check

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev shell carries the pinned Go, Bun, wails3 and the GTK4 plus
      # WebKitGTK 6.0 headers the cgo build needs, so CI uses the same
      # toolchain the repository pins instead of the runner's packages.
      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install frontend dependencies
        run: nix develop .#default -c bun ci --ignore-scripts

      # go:embed needs a real dist directory; CI builds it instead of relying on
      # a committed placeholder.
      - name: Build embedded frontend
        run: nix develop .#default -c bun run build:wails

      - name: Check Go formatting
        run: |
          nix develop .#default -c bash -c '
            test -z "$(gofmt -l $(git ls-files "*.go"))"
          '

      - name: Vet
        run: nix develop .#default -c go vet ./...

      # Bun on Windows fails to link the named `Call` export of the ESM
      # @wailsio/runtime package at test time, while Vite's bundler resolves it.
      # The suite is identical under Linux, so it also runs here.
      - name: Frontend tests
        run: nix develop .#default -c bun run test

      - name: Go tests
        run: nix develop .#default -c go test ./...

      # Server mode is a Wails build tag, so the headless binary is a second
      # build of the same source, not a runtime flag.
      - name: Build desktop and server artifacts
        run: |
          nix develop .#default -c bash -c '
            set -euo pipefail
            mkdir -p build/ci
            go build -trimpath -o build/ci/modkeeper .
            go build -trimpath -tags server -o build/ci/modkeeper-server .
          '

      - name: Smoke-test server mode
        run: |
          nix develop .#default -c bash -c '
            set -euo pipefail
            MODKEEPER_SERVER_PORT=18080 ./build/ci/modkeeper-server > /tmp/server.log 2>&1 &
            pid=$!
            ready=0
            for _ in $(seq 1 100); do
              if curl -fsS http://127.0.0.1:18080/ > /dev/null 2>&1; then ready=1; break; fi
              sleep 0.1
            done
            kill "$pid" 2>/dev/null || true
            cat /tmp/server.log
            test "$ready" = 1
            grep -q "Server mode enabled" /tmp/server.log
          '

      - name: Check Wails bindings are pruned
        run: nix develop .#default -c bun run bindings:wails:check

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modkeeper-linux-x86_64
          path: |
            build/ci/modkeeper
            build/ci/modkeeper-server
          if-no-files-found: error
          retention-days: 7
